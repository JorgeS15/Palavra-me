# Corre os testes do pipeline a cada alteração.
#
# Só o pipeline: a app precisaria do dicionário de 200 MB, que não é
# versionado (reconstrói-se com `palavrame f1`). Os testes do pipeline, esses,
# correm sobre fixtures sintéticas e são inteiramente offline — o que os torna
# perfeitos para integração contínua.
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 é o Python de sistema da máquina onde o pipeline corre; 3.12
        # apanha o que só falharia numa versão mais recente.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar
        working-directory: pipeline
        run: python -m pip install --upgrade pip pytest
      - name: Testes
        working-directory: pipeline
        run: python -m pytest -q
